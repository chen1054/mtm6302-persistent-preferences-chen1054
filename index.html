<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Persistent Preferences</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container-fluid py-4">
    <div class="row g-4">

      <!-- List Section -->
      <div class="col-12 col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h4 mb-4">List</h2>
            <ul id="item-list" class="list-group"></ul>
          </div>
        </div>
      </div>

      <!-- Preferences Panel -->
      <div class="col-12 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h4 mb-4">Preferences</h2>

            <div class="mb-3">
              <label for="theme-select" class="form-label">Theme:</label>
              <select id="theme-select" class="form-select">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                <option value="pastel">Pastel</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="list-style-select" class="form-label">List Style:</label>
              <select id="list-style-select" class="form-select">
                <option value="expanded">Expanded</option>
                <option value="compact">Compact</option>
                <option value="bordered">Bordered</option>
              </select>
            </div>

            <button id="reset-btn" class="btn btn-primary">Reset Preferences</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
